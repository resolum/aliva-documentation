name: Move Jira task to TO-FIX

on:
  pull_request_review:
    types:
      - submitted

jobs:
  notify-jira:
    if: github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest

    steps:
      - name: Extract Jira issue key
        id: jira
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ ([A-Z]+-[0-9]+) ]]; then
            echo "issue_key=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "The PR title does not contain a Jira issue key"
            exit 1
          fi

      - name: Notify Jira
        env:
          WEBHOOK_URL: ${{ secrets.JIRA_CHANGES_REQUESTED_WEBHOOK }}
          WEBHOOK_TOKEN: ${{ secrets.JIRA_AUTOMATION_WEBHOOK_TOKEN }}
          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          jq -n \
            --arg issueKey "$ISSUE_KEY" \
            --arg pullRequest "$PR_NUMBER" \
            --arg action "changes_requested" \
            '{
              issueKey: $issueKey,
              pullRequest: $pullRequest,
              action: $action
            }' > payload.json

          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Automation-Webhook-Token: $WEBHOOK_TOKEN" \
            --data @payload.json \
            "$WEBHOOK_URL"